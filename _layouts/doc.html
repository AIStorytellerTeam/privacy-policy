<!doctype html>
<html lang="{{ page.lang | default: 'ru' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — AI Storyteller</title>
<style>
  :root {
    --bg: #fff9f2;
    --card: #ffffff;
    --ink: #2f2a24;
    --muted: #6f675d;
    --accent: #2f5d3a;
    --line: #e7ddcd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1916;
      --card: #242120;
      --ink: #ece5da;
      --muted: #a79d90;
      --accent: #8fc29c;
      --line: #3a3430;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline;
    margin-bottom: 24px; font-size: 14px;
  }
  .bar a { color: var(--accent); text-decoration: none; }
  .bar a:hover { text-decoration: underline; }
  .bar .sep { color: var(--line); }
  main {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 24px;
  }
  h1 { font-size: 1.7rem; line-height: 1.25; margin: 0 0 20px; }
  h2 { font-size: 1.2rem; margin: 32px 0 10px; color: var(--accent); }
  h3 { font-size: 1.02rem; margin: 22px 0 8px; }
  p, li { overflow-wrap: break-word; }
  ul, ol { padding-left: 22px; }
  li { margin: 4px 0; }
  a { color: var(--accent); }
  code {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 5px; font-size: 0.92em;
  }
  hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; }
  th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  .tablewrap { overflow-x: auto; }
  footer { margin-top: 28px; font-size: 13px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="bar">
    <a href="{{ '/' | relative_url }}">← Все документы</a>
    {% if page.alt %}<span class="sep">·</span>
    <a href="{{ page.alt | relative_url }}">{{ page.altLabel }}</a>{% endif %}
  </nav>
  <main>
    {{ content }}
  </main>
  <footer>AI Storyteller · aistoryteller.team@gmail.com</footer>
</div>
</body>
</html>
