title: AI Storyteller — документы
description: Политика конфиденциальности, пользовательское соглашение и удаление аккаунта

# Тему не подключаем намеренно: весь вид задаёт _layouts/doc.html с
# встроенным CSS. Готовые темы GitHub Pages тянут свои шрифты и баннеры,
# а юридические документы должны просто хорошо читаться с телефона.

exclude:
  - README.md

defaults:
  - scope:
      path: ''
    values:
      layout: doc
