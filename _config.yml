title: AI Storyteller — документы
description: Политика конфиденциальности, пользовательское соглашение и удаление аккаунта

# Сайт живёт не в корне домена, а в подпапке с именем репозитория:
# https://aistorytellerteam.github.io/privacy-policy/
# Поэтому все ссылки внутри страниц пишутся через relative_url — иначе «/privacy/»
# увёл бы на корень github.io, где такой страницы нет.
# Если однажды подключите свой домен — обнулите baseurl: baseurl: ""
url: https://aistorytellerteam.github.io
baseurl: /privacy-policy

# Тему не подключаем намеренно: весь вид задаёт _layouts/doc.html с
# встроенным CSS. Готовые темы GitHub Pages тянут свои шрифты и баннеры,
# а юридические документы должны просто хорошо читаться с телефона.

exclude:
  - README.md

defaults:
  - scope:
      path: ''
    values:
      layout: doc
